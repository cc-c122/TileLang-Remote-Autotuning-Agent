notes:
  - This manifest is a reproducibility checklist for a real C500 Paged Attention Decode baseline.
  - Two supported shapes completed real controlled source trials; neither candidate was accepted and no speedup is claimed.
  - The historical SSH/default-import blockers are retained; a source runtime was later found at /app/tilelang-metax without installing a replacement wheel.
  - Native attribution-control Cases are separate calibration evidence, not Paged Attention data.
  - This three-context manifest remains partial because context 2048 has not been collected.
  - Counter scope and background isolation remain unknown; report selection does not verify attribution.
  - Reproduction leaf commands run at a managed remote workspace containing uploaded sample files; the real acceptance used the Web task API.
  - Complete requests, individual latency samples, source diff and failed collection metadata are in the referenced evidence files.
